
name: Build Pin Paper Release



on:

  push:

    tags:

      - "v*"



permissions:

  contents: write



jobs:

  build-mac:

    name: Build macOS

    runs-on: macos-latest



    steps:

      - name: Check out source

        uses: actions/checkout@v4



      - name: Set up Node

        uses: actions/setup-node@v4

        with:

          node-version: 22

          cache: npm



      - name: Install dependencies

        run: npm ci



      - name: Check project

        run: |

          npm run typecheck

          npm test



      - name: Build macOS installers

        run: npm run app:mac

        env:

          CSC_IDENTITY_AUTO_DISCOVERY: "false"



      - name: Upload macOS release files

        uses: softprops/action-gh-release@v3

        with:

          generate_release_notes: true

          make_latest: true

          files: |

            release/*.dmg

            release/*-mac.zip



  build-windows:

    name: Build Windows

    runs-on: windows-latest



    steps:

      - name: Check out source

        uses: actions/checkout@v4



      - name: Set up Node

        uses: actions/setup-node@v4

        with:

          node-version: 22

          cache: npm



      - name: Install dependencies

        run: npm ci



      - name: Check project

        run: |

          npm run typecheck

          npm test



      - name: Build Windows installers

        run: npm run app:win

        env:

          CSC_IDENTITY_AUTO_DISCOVERY: "false"



      - name: Upload Windows release files

        uses: softprops/action-gh-release@v3

        with:

          generate_release_notes: true

          make_latest: true

          files: |

            release/*.exe

